# Django: HTTP API and websockets (the backend-api service listens on 8000).
upstream backend {
    server backend-api:8000;
}

# Websockets need the Upgrade/Connection headers passed through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    # ---- Frontend --------------------------------------------------------
    # Serves the built files in ./frontend (mounted at /src). To use a frontend
    # dev server on your machine instead (for example Vite on port 5173), replace
    # this block with:
    #     location / { proxy_pass http://host.docker.internal:5173; }
    location / {
        root /src;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- Django ----------------------------------------------------------
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3000s; # long-running API calls (kept from the original setup)
        proxy_read_timeout 3000s;
    }

    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keep idle websockets open for an hour
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
