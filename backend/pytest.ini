[pytest]
DJANGO_SETTINGS_MODULE = backend.settings_test
# Keep DEBUG as .env sets it: the development pages are only mounted when DEBUG is on.
django_debug_mode = keep
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    e2e: talks to the running stack through NGINX (set E2E_BASE_URL)
filterwarnings =
    # drf-yasg's schema validator still imports a deprecated jsonschema API; nothing to fix on our side.
    ignore:jsonschema.RefResolver is deprecated:DeprecationWarning
    error::DeprecationWarning:(authentication|custom_jwt|dev_dashboard|api_proxy|django_login_history|userprofile|ping|backend|common).*
