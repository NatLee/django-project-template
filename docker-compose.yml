# Every name, port and secret comes from .env (copy .env.example to start).
name: ${PROJECT_NAME}

x-common: &common
  restart: unless-stopped
  networks:
    - net

services:
  backend-postgres:
    <<: *common
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME}-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-redis:
    <<: *common
    image: redis:8-alpine
    container_name: ${PROJECT_NAME}-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Django (web + websockets) and the django-q2 worker, both under supervisor.
  backend-api:
    <<: *common
    build: .
    image: ${PROJECT_NAME}-backend:latest
    container_name: ${PROJECT_NAME}-api
    env_file: .env
    volumes:
      - ./backend:/app # live code reload while developing; remove for production
    depends_on:
      backend-postgres:
        condition: service_healthy
      backend-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  backend-nginx:
    <<: *common
    image: nginx:1.30-alpine
    container_name: ${PROJECT_NAME}-nginx
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/src:ro # your built frontend goes here
    extra_hosts:
      # lets NGINX reach a frontend dev server running on your machine (see nginx/default.conf)
      - "host.docker.internal:host-gateway"
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  net:
    name: ${PROJECT_NAME}-net
    driver: bridge
